name: Learnora Backend Verification

on:
  push:
    paths:
      - "backend-python/**"
      - "supabase/migrations/**"
      - ".github/workflows/learnora-backend.yml"
  pull_request:
    paths:
      - "backend-python/**"
      - "supabase/migrations/**"

jobs:
  python-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Validate imports
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path(".").rglob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print("Python AST validation passed")
          PY
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Import application
        env:
          APP_ENV: development
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.test-signature
          JWT_SECRET: learnora-ci-only-secret-32-characters-minimum
        run: python -c "import main; print('Learnora application import passed')"
