name: Learnora Backend Verification

on:
  push:
    paths:
      - "backend-python/**"
      - "supabase/migrations/**"
      - ".github/workflows/learnora-backend.yml"
  pull_request:
    paths:
      - "backend-python/**"
      - "supabase/migrations/**"

jobs:
  python-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Validate imports
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path(".").rglob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print("Python AST validation passed")
          PY
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Static undefined-name and syntax checks
        run: |
          python -m pip install ruff
          ruff check . --select E9,F821,F811
      - name: Import every backend Python module
        env:
          APP_ENV: development
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.test-signature
          JWT_SECRET: learnora-ci-only-secret-32-characters-minimum
        run: |
          python - <<'PY'
          import importlib
          from pathlib import Path
          modules = []
          for path in Path(".").rglob("*.py"):
              if path.name == "__init__.py":
                  continue
              modules.append(".".join(path.with_suffix("").parts))
          for module in sorted(modules):
              importlib.import_module(module)
          print(f"Imported {len(modules)} backend modules successfully")
          PY
      - name: Import application
        env:
          APP_ENV: development
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.test-signature
          JWT_SECRET: learnora-ci-only-secret-32-characters-minimum
        run: python -c "import main; print('Learnora application import passed')"
      - name: Runtime API smoke test
        env:
          APP_ENV: development
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.test-signature
          JWT_SECRET: learnora-ci-only-secret-32-characters-minimum
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 >/tmp/learnora-backend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=2) as response:
                      if response.status == 200:
                          body = response.read().decode()
                          print(body)
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("Backend health endpoint did not become ready")
          PY
          curl --fail --silent --show-error http://127.0.0.1:8000/ >/tmp/learnora-root.json
          cat /tmp/learnora-root.json
