name: Import legacy Learnora Markdown content

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the copied course, module and Markdown lesson rows to Supabase"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  import-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend-python/requirements.txt

      - name: Preview migration or import draft content
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python backend-python/scripts/import_legacy_markdown_courses.py --apply
          else
            python backend-python/scripts/import_legacy_markdown_courses.py
          fi
