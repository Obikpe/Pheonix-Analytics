name: Learnora quality checks

on:
  push:
    branches: [main]
    paths:
      - "backend-python/**"
      - "frontend-v02/**"
      - "frontend-team/**"
      - ".github/workflows/learnora-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend-python/**"
      - "frontend-v02/**"
      - "frontend-team/**"
      - ".github/workflows/learnora-quality.yml"

permissions:
  contents: read

concurrency:
  group: learnora-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile backend modules
        run: python -m compileall -q backend-python

  frontend-build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: frontend-v02
            directory: frontend-v02
          - app: frontend-team
            directory: frontend-team
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js app
        run: npm run build
